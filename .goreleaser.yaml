version: 2

project_name: gangplank

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [ linux, darwin, windows, freebsd ]
    goarch: [ amd64, arm64, arm, 386 ]
    goarm: [ '6', '7' ]
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/IonBazan/gangplank/cmd.version={{ .Version }}
      - -X github.com/IonBazan/gangplank/cmd.commit={{ .ShortCommit }}
      - -X github.com/IonBazan/gangplank/cmd.created={{ .Date }}

archives:
  - formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - doc/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^Merge '
  groups:
    - title: Dependency updates
      regexp: '(?i)^.*\b(bump|update) .+ from .+ to '
      order: 2
    - title: Changes
      order: 1

release:
  prerelease: auto
